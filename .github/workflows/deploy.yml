name: Deploy consultant app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The source lives in the main repo; this repo is the deploy shell
      # for the consultant (--mode pro) build.
      - uses: actions/checkout@v7
        with:
          repository: onenamocom-stack/namoApp
          ref: main
          # namoApp is private; the workflow's own GITHUB_TOKEN cannot see
          # it. A fine-grained PAT with contents:read on namoApp lives in
          # this secret.
          token: ${{ secrets.SOURCE_REPO_PAT }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify build env is present
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DJANGO_API_URL: ${{ secrets.VITE_DJANGO_API_URL }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL secret is missing or empty"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY secret is missing or empty"; exit 1; }
          # namoApp's cutover libs read this. Empty means every API path
          # resolves against the page origin and 404s, and listConsultants
          # turns that into an empty list rather than an error — an outage
          # that reads as an empty marketplace. The /v1 suffix is part of
          # the value; omitting it is the same failure by another route.
          test -n "$VITE_DJANGO_API_URL" || { echo "::error::VITE_DJANGO_API_URL secret is missing or empty"; exit 1; }
          case "$VITE_DJANGO_API_URL" in
            */v1) : ;;
            *) echo "::error::VITE_DJANGO_API_URL must end in /v1 (got: $VITE_DJANGO_API_URL)"; exit 1 ;;
          esac
      - run: npm run build:pro
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DJANGO_API_URL: ${{ secrets.VITE_DJANGO_API_URL }}
          # Served from a project page (…github.io/namo-pro/), not a domain
          # apex — assets must be referenced under /namo-pro/.
          DEPLOY_BASE: /namo-pro/
      # The seeker build carries a CNAME for 1namo.com; publishing it here
      # too would make two Pages sites claim the same custom domain. This
      # site serves only from the github.io hostname.
      - run: rm -f dist-pro/CNAME
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pro

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
